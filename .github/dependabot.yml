version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
        update-types:
          - minor
          - patch
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "com.google.devtools.ksp"
        update-types:
          - minor
          - patch
      hilt:
        patterns:
          - "com.google.dagger*"
          - "androidx.hilt*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "com.google.dagger*"
        versions:
          # Hilt 2.58+ requires a coordinated Kotlin/KSP migration.
          - ">= 2.58.0"
      - dependency-name: "androidx.hilt:*"
        versions:
          # AndroidX Hilt 1.4 requires API 37 and AGP 9.1.
          - ">= 1.4.0"
      # Newer AndroidX lines require a coordinated compile SDK and AGP migration.
      - dependency-name: "androidx.core:*"
        versions:
          - ">= 1.16.0"
      - dependency-name: "androidx.lifecycle:*"
        versions:
          - ">= 2.9.0"
      - dependency-name: "androidx.activity:*"
        versions:
          - ">= 1.10.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
